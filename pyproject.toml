[project]
name = "gnn-connectivity-matrix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mahdi Moghaddami", email = "mahdiman10@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dcm2niix>=1.0.20260724",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydicom>=3.0.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
gnn-connectivity-matrix = "gnn_connectivity_matrix:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
